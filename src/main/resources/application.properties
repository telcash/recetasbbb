# MySQL DB config (se conecta al servicio 'mysql' en docker-compose)
spring.datasource.url=jdbc:mysql://mysql:3306/recetabbb
spring.datasource.username=root
spring.datasource.password=root

# JPA config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Puerto del servidor
server.port=3000

# Nombre de la app
spring.application.name=recetabbb

