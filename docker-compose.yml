version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: recetabbb
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - recetabbb-net
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recetabbb-api
    depends_on:
      - mysql
    ports:
      - "3000:3000"
    networks:
      - recetabbb-net
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}

volumes:
  db_data:

networks:
  recetabbb-net:
    driver: bridge
